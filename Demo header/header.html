<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Header VNB</title>
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="main-header">
    <div class="logo"> 
      <img src = "../image/SCD.png" alt="logo" class="logo-img"/>
    </div>
    <div class="right">
      <i class="fa-solid fa-user"></i>
      <span>HOTLINE: <span class="hotline">0948245045</span></span>
    </div>
    

    <div class="search-box">
      <input type="text" placeholder="Tìm sản phẩm..." />
      <button><i class="fa-solid fa-magnifying-glass"></i></button>
      <div class="right">
        <i class="fa-solid fa-location-dot"></i>
        <span>HỆ THỐNG CỬA HÀNG</span>
      </div>
    </div>

    <div class="icons">
      <div><i class="fa-solid fa-binoculars"></i><span>TRA CỨU</span></div>
      <div><i class="fa-solid fa-user"></i><span>TÀI KHOẢN</span></div>
      <div class="cart">
        <i class="fa-solid fa-cart-shopping"></i><span>GIỎ HÀNG</span>
        <span class="badge">1</span>
      </div>
    </div>
  </div>

  <nav class="navbar">
    <a href="#">TRANG CHỦ</a>
    <a href="#">SẢN PHẨM ▾</a>
    <a href="#">SALE OFF</a>
    <a href="#">CHÍNH SÁCH NHƯỢNG QUYỀN</a>
    <a href="#">GIỚI THIỆU</a>
    <a href="#">LIÊN HỆ</a>
  </nav>

</body>
</html>
